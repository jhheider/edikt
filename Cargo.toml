[workspace]
resolver = "3"
members = ["crates/*"]

# Shared, non-version metadata. Versions are per-crate (see each crate's
# Cargo.toml) so crates can be released independently.
[workspace.package]
edition = "2024"
authors = ["Jacob Heider <jhheider@gmail.com>"]
repository = "https://github.com/jhheider/edikt"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
# Internal crates (path + version so they can publish independently).
edikt-core = { path = "crates/edikt-core", version = "0.2.1" }
edikt-syntax = { path = "crates/edikt-syntax", version = "0.2.0" }
edikt-jsonc = { path = "crates/edikt-jsonc", version = "0.2.2" }
edikt-ini = { path = "crates/edikt-ini", version = "0.2.1" }
edikt-env = { path = "crates/edikt-env", version = "0.2.1" }
edikt-toml = { path = "crates/edikt-toml", version = "0.2.1" }
edikt-yaml = { path = "crates/edikt-yaml", version = "0.2.0" }
edikt-kdl = { path = "crates/edikt-kdl", version = "0.2.1" }
# Third-party.
rowan = "0.16"
kdl = "6"
logos = "0.16"
regex = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
# Errors: thiserror for library error types, anyhow for the binary.
thiserror = "2"
anyhow = "1"
