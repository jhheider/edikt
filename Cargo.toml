[workspace]
resolver = "3"
members = ["crates/*"]

# Shared, non-version metadata. Versions are per-crate (see each crate's
# Cargo.toml) so crates can be released independently.
[workspace.package]
edition = "2024"
authors = ["Jacob Heider <jhheider@gmail.com>"]
repository = "https://github.com/jhheider/edikt"

[workspace.dependencies]
# Internal crates (path + version so they can publish independently).
edikt-core = { path = "crates/edikt-core", version = "0.0.0" }
edikt-syntax = { path = "crates/edikt-syntax", version = "0.0.0" }
edikt-jsonc = { path = "crates/edikt-jsonc", version = "0.0.0" }
edikt-ini = { path = "crates/edikt-ini", version = "0.0.0" }
edikt-env = { path = "crates/edikt-env", version = "0.0.0" }
edikt-toml = { path = "crates/edikt-toml", version = "0.0.0" }
edikt-yaml = { path = "crates/edikt-yaml", version = "0.0.0" }
# Third-party.
rowan = "0.16"
logos = "0.16"
clap = { version = "4", features = ["derive"] }
