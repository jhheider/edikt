[package]
name = "edikt"
version = "0.2.7"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Lossless, format-preserving config editor: JSONC/JSON5, INI, .env/.properties, TOML, YAML - jq-flavored expressions, sed-shaped I/O."
readme = { workspace = true }

[dependencies]
edikt-core = { workspace = true }
edikt-jsonc = { workspace = true }
edikt-ini = { workspace = true }
edikt-env = { workspace = true }
edikt-toml = { workspace = true }
edikt-yaml = { workspace = true }
edikt-kdl = { workspace = true }
edikt-frontmatter = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
anyhow = { workspace = true }

# rust-ci's release.yml ships assets as `edikt-{os}-{arch}.{ext}` (no version,
# no full target triple), which matches none of cargo-binstall's default
# guess templates, so `cargo binstall edikt` silently fell back to compiling
# from source. archive-suffix resolves against every extension binstall
# knows for the given pkg-fmt (both .tgz and .tar.gz for Tgz), so this
# matches the actual .tar.gz assets without hardcoding it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ bin }-{ os-name }-{ target-arch }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
