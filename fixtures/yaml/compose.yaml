# docker-compose-style
version: "3.9"

services:
  web:
    image: nginx:1.25   # pinned
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEBUG: "false"
    depends_on:
      - db
  db:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
